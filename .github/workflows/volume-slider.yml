name: Volume Slider build

on:
  push:
    paths:
      - VolumeSlider.zip
      - .github/workflows/volume-slider.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Unzip project
        run: |
          rm -rf vs && mkdir vs
          unzip -q VolumeSlider.zip -d vs
          SETTINGS=$(find vs -maxdepth 3 -name settings.gradle | head -n1)
          if [ -z "$SETTINGS" ]; then echo "No settings.gradle in zip"; find vs | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          find "$(dirname "$SETTINGS")" -maxdepth 4 -type f | head -40

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: volumeslider-debug
          path: vs/**/build/outputs/apk/debug/*.apk
