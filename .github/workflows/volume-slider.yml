name: Volume Slider build

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/volume-slider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Initialize diagnostics
        id: init
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/build.log"
          echo "Workflow started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" | tee -a "$RUNNER_TEMP/build.log"

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        id: android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        id: sdk
        run: |
          set -euo pipefail
          {
            echo "Android SDK root: ${ANDROID_SDK_ROOT:-${ANDROID_HOME:-unknown}}"
            sdkmanager --version
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Set up Gradle 8.13
        id: gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Unzip and locate Android project
        id: unzip
        run: |
          set -euo pipefail
          {
            echo '=== Repository root ==='
            ls -la "$GITHUB_WORKSPACE"

            shopt -s nullglob
            ZIP_FILES=( "$GITHUB_WORKSPACE"/*.zip )
            if (( ${#ZIP_FILES[@]} == 0 )); then
              echo 'ERROR: No .zip file was found in the repository root.'
              exit 1
            fi

            ZIP=''
            for candidate in "${ZIP_FILES[@]}"; do
              if [[ "$(basename "$candidate")" == 'VolumeSlider.zip' ]]; then
                ZIP="$candidate"
                break
              fi
            done
            if [[ -z "$ZIP" ]]; then ZIP="${ZIP_FILES[0]}"; fi

            echo "Using archive: $(basename "$ZIP")"
            UNPACK_DIR="$RUNNER_TEMP/volume-slider-unpacked"
            rm -rf "$UNPACK_DIR"
            mkdir -p "$UNPACK_DIR"
            unzip -t "$ZIP"
            unzip -q "$ZIP" -d "$UNPACK_DIR"

            PROJECT_DIR=''
            while IFS= read -r -d '' settings_file; do
              candidate_dir="$(dirname "$settings_file")"
              if [[ -f "$candidate_dir/app/build.gradle" || -f "$candidate_dir/app/build.gradle.kts" ]]; then
                PROJECT_DIR="$candidate_dir"
                break
              fi
            done < <(find "$UNPACK_DIR" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print0 | sort -z)

            if [[ -z "$PROJECT_DIR" ]]; then
              echo 'ERROR: Could not find settings.gradle[.kts] with an app/build.gradle[.kts] module.'
              find "$UNPACK_DIR" -maxdepth 5 -type f -print | head -100
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Android project root: $PROJECT_DIR"
            echo '=== Project files ==='
            find "$PROJECT_DIR" -maxdepth 5 -type f -print | sort | head -150
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build debug APK
        id: build
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          {
            if [[ -f ./gradlew ]]; then
              chmod +x ./gradlew
              GRADLE_CMD=( ./gradlew )
            else
              if ! command -v gradle >/dev/null 2>&1; then
                echo 'ERROR: No Gradle wrapper was found and Gradle is not on PATH.'
                exit 1
              fi
              GRADLE_CMD=( gradle )
            fi

            "${GRADLE_CMD[@]}" --version
            "${GRADLE_CMD[@]}" --no-daemon --stacktrace --console=plain :app:assembleDebug

            mkdir -p "$GITHUB_WORKSPACE/artifacts"
            mapfile -t APK_FILES < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print)
            if (( ${#APK_FILES[@]} == 0 )); then
              echo 'ERROR: Gradle completed but no debug APK was produced.'
              exit 1
            fi
            for apk in "${APK_FILES[@]}"; do
              cp "$apk" "$GITHUB_WORKSPACE/artifacts/$(basename "$apk")"
              echo "APK: $GITHUB_WORKSPACE/artifacts/$(basename "$apk")"
            done
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload debug APK
        id: upload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: volumeslider-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write build diagnostics to Summary
        if: always()
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          JAVA_RESULT: ${{ steps.java.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
          SDK_RESULT: ${{ steps.sdk.outcome }}
          GRADLE_SETUP_RESULT: ${{ steps.gradle.outcome }}
          UNZIP_RESULT: ${{ steps.unzip.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Volume Slider build report'
            echo
            echo '| Stage | Result |'
            echo '|---|---|'
            echo "| Checkout | ${CHECKOUT_RESULT:-not run} |"
            echo "| JDK setup | ${JAVA_RESULT:-not run} |"
            echo "| Android SDK setup | ${ANDROID_RESULT:-not run} |"
            echo "| SDK packages | ${SDK_RESULT:-not run} |"
            echo "| Gradle setup | ${GRADLE_SETUP_RESULT:-not run} |"
            echo "| ZIP extraction | ${UNZIP_RESULT:-not run} |"
            echo "| APK build | ${BUILD_RESULT:-not run} |"
            echo "| Artifact upload | ${UPLOAD_RESULT:-not run} |"
            echo
            if [[ -f "$RUNNER_TEMP/build.log" ]]; then
              echo '### Build log (last 100 lines)'
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/build.log"
              echo '```'
            else
              echo 'No shell log was created. Check the first setup stage marked `failure` above; it failed before the diagnostic shell steps ran.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
