name: Volume Slider build

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/volume-slider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Volume Slider APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner image already contains the Android SDK.
      # Avoid android-actions/setup-android, which is the failing step
      # in the current run.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found at $ANDROID_HOME"
            echo "Available SDK-related directories:"
            ls -la /usr/local/lib/android/ || true
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in the preinstalled Android SDK"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses and install common packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Locate and extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository contents:"
          ls -la

          ZIP=""
          if [ -f "VolumeSlider.zip" ]; then
            ZIP="VolumeSlider.zip"
          else
            ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::No project ZIP found in the repository root."
            exit 1
          fi

          echo "Using project archive: $ZIP"
          rm -rf vs
          mkdir -p vs
          unzip -q "$ZIP" -d vs

          SETTINGS="$(find vs -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside the ZIP."
            find vs -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -120

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain
          else
            gradle :app:assembleDebug --stacktrace --no-daemon --console=plain
          fi 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volumeslider-debug
          path: |
            vs/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-slider-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Add failure details to Summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Volume Slider build failed"
            echo
            echo "Failed step: check the red step above for its complete output."
            echo
            if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
              echo "### Gradle errors"
              echo '```'
              grep -E '(^e: | error: |FAILURE:|What went wrong:|Could not )' "$RUNNER_TEMP/gradle-build.log" | tail -80 || true
              echo '```'
              echo "### Last 80 log lines"
              echo '```'
              tail -n 80 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            else
              echo "Gradle did not start; inspect the failed SDK or ZIP setup step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
