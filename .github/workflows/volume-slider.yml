name: Volume Slider build

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/volume-slider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Volume Slider APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Do not pass cache-provider: it is not a supported input for setup-gradle.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate and extract project ZIP
        id: unzip
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( "$GITHUB_WORKSPACE"/*.zip )
          if (( ${#zips[@]} == 0 )); then
            echo 'ERROR: No ZIP archive found in repository root.'
            exit 1
          fi
          zip_file=''
          for candidate in "${zips[@]}"; do
            if [[ "$(basename "$candidate")" == 'VolumeSlider.zip' ]]; then
              zip_file="$candidate"
              break
            fi
          done
          [[ -n "$zip_file" ]] || zip_file="${zips[0]}"
          echo "Using archive: $(basename "$zip_file")"
          unzip -t "$zip_file"
          project_root="$RUNNER_TEMP/volume-slider-project"
          rm -rf "$project_root"
          mkdir -p "$project_root"
          unzip -q "$zip_file" -d "$project_root"
          settings_file="$(find "$project_root" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo 'ERROR: settings.gradle or settings.gradle.kts not found in ZIP.'
            find "$project_root" -maxdepth 5 -type f -print
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          if [[ ! -f "$project_dir/app/build.gradle" && ! -f "$project_dir/app/build.gradle.kts" ]]; then
            echo 'ERROR: app module Gradle build file not found.'
            find "$project_dir" -maxdepth 4 -type f -print
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project root: $project_dir"

      - name: Build debug APK (capture full compiler output)
        id: build
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            gradle_cmd=( ./gradlew )
          else
            gradle_cmd=( gradle )
          fi
          set +e
          "${gradle_cmd[@]}" --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if (( result != 0 )); then
            echo "Gradle exited with code $result"
            exit "$result"
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mapfile -t apks < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print)
          if (( ${#apks[@]} == 0 )); then
            echo 'ERROR: Build reported success but no debug APK was found.'
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "$GITHUB_WORKSPACE/artifacts/"
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volumeslider-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write failure details to Summary
        if: always()
        run: |
          {
            echo '## Volume Slider build diagnostics'
            echo
            if [[ -f "$RUNNER_TEMP/gradle-build.log" ]]; then
              echo '### Compiler and build errors'
              echo '```text'
              grep -n -E '(^e: | error: |What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Expecting )' "$RUNNER_TEMP/gradle-build.log" | tail -n 100 || true
              echo '```'
              echo
              echo '### Last 160 log lines'
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            else
              echo 'The Gradle build did not start. Check the failed setup step above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full Gradle log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: volume-slider-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
