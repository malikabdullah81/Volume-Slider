name: Volume Slider build

on:
  push:
    paths:
      - '*.zip'
      - .github/workflows/volume-slider.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Unzip project
        shell: bash
        run: |
          {
            echo "=== top folder ==="; ls -la
            ZIP=""
            if [ -f VolumeSlider.zip ]; then ZIP=VolumeSlider.zip; else ZIP=$(ls *.zip 2>/dev/null | head -n1); fi
            if [ -z "$ZIP" ]; then echo "ERROR: no zip in the repo top folder"; exit 1; fi
            echo "Using $ZIP"
            rm -rf vs && mkdir vs
            unzip -q "$ZIP" -d vs
            SETTINGS=$(find vs -maxdepth 3 -name settings.gradle | head -n1)
            if [ -z "$SETTINGS" ]; then echo "ERROR: no settings.gradle inside the zip"; find vs | head -50; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
            find "$(dirname "$SETTINGS")" -maxdepth 4 -type f
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --console=plain --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: volumeslider-debug
          path: vs/**/build/outputs/apk/debug/*.apk

      - name: Put the error on the Summary page
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failed'
            echo 'Kotlin errors (lines starting with e:):'
            echo '```'
            grep -E '^e: ' "$RUNNER_TEMP/build.log" 2>/dev/null | head -30 || true
            echo '```'
            echo 'Last 50 lines of the log:'
            echo '```'
            tail -n 50 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no log: it failed before the unzip step"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
